name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Install sshpass (cached)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

      - name: Deploy via SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PASS: ${{ secrets.SSH_PASS }}
        run: |
          if [ -n "${{ secrets.SSH_KEY }}" ]; then
            echo "${{ secrets.SSH_KEY }}" > /tmp/deploy_key
            chmod 600 /tmp/deploy_key
            ssh -i /tmp/deploy_key -p "${SSH_PORT:-22}" \
              -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              "$SSH_USER@$SSH_HOST" 'bash /opt/prolab-deploy.sh prolab 3002'
          else
            sshpass -p "$SSH_PASS" ssh -p "${SSH_PORT:-22}" \
              -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              "$SSH_USER@$SSH_HOST" 'bash /opt/prolab-deploy.sh prolab 3002'
          fi
